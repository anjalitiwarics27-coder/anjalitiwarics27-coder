<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 390" width="800" height="390" role="img" aria-label="Animated internship timeline 2026: EduSkills, Wildlife Institute of India, DigiSamaksh" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ec4899"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#150f33"/>
    </linearGradient>
    <radialGradient id="dotglow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f0abfc" stop-opacity=".9"/>
      <stop offset="1" stop-color="#f0abfc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <style>
    text { font-family: 'Fira Code', 'Segoe UI', Consolas, monospace; }
    .title { font-size: 17px; font-weight: 700; fill: #f0abfc; letter-spacing: 1px; }
    .date  { font-size: 11px; font-weight: 700; fill: #fff; }
    .role  { font-size: 12.5px; font-weight: 700; fill: #ffffff; }
    .org   { font-size: 12px; fill: #f472b6; }
    .tag   { font-size: 11px; fill: #e9d5ff; }
    .glyph { font-size: 15px; font-weight: 800; fill: #fff; }

    .line-draw { stroke-dasharray: 740; stroke-dashoffset: 740; animation: draw 2.2s ease-out .2s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }

    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.8,.2,1) forwards; }
    .d1 { animation-delay: .6s; } .d2 { animation-delay: 1.2s; } .d3 { animation-delay: 1.8s; }
    @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }

    .ring { transform-box: fill-box; transform-origin: center; animation: ring 2.4s ease-out infinite; }
    .r2 { animation-delay: .8s; } .r3 { animation-delay: 1.6s; }
    @keyframes ring { 0% { transform: scale(.6); opacity: .9; } 100% { transform: scale(2.4); opacity: 0; } }

    .runner { animation: run 6s linear 2.4s infinite; opacity: 0; }
    @keyframes run { 0% { transform: translateX(0); opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { transform: translateX(720px); opacity: 0; } }

    .shine { animation: shine 4s ease-in-out infinite; }
    @keyframes shine { 50% { opacity: .35; } }

    .bob  { animation: bob 3.2s ease-in-out infinite; }
    .bob2 { animation: bob 3.2s ease-in-out infinite .6s; }
    .bob3 { animation: bob 3.2s ease-in-out infinite 1.2s; }
    @keyframes bob { 50% { transform: translateY(-4px); } }

    .tw  { animation: tw 2.4s ease-in-out infinite; }
    .tw2 { animation: tw 3.1s ease-in-out infinite .7s; }
    @keyframes tw { 50% { opacity: .15; } }
  </style>

  <!-- background -->
  <rect width="800" height="390" rx="22" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="797" height="387" rx="21" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".7"/>

  <g fill="#f5d0fe">
    <circle class="tw"  cx="30"  cy="30"  r="1.8"/>
    <circle class="tw2" cx="770" cy="28"  r="2"/>
    <circle class="tw"  cx="775" cy="360" r="1.6"/>
    <circle class="tw2" cx="26"  cy="362" r="1.8"/>
  </g>

  <text x="400" y="30" text-anchor="middle" class="title">✦ INTERNSHIP JOURNEY · 2026 ✦</text>

  <!-- timeline -->
  <line x1="40" y1="92" x2="760" y2="92" stroke="#3b0764" stroke-width="5" stroke-linecap="round"/>
  <line class="line-draw" x1="40" y1="92" x2="760" y2="92" stroke="url(#neon)" stroke-width="5" stroke-linecap="round"/>
  <g class="runner"><circle cx="40" cy="92" r="14" fill="url(#dotglow)"/><circle cx="40" cy="92" r="4" fill="#fff"/></g>

  <!-- ===== CARD 1 ===== -->
  <g transform="translate(20,0)">
    <g class="rise d1">
      <rect x="62" y="44" width="116" height="22" rx="11" fill="#7e22ce"/>
      <text x="120" y="59" text-anchor="middle" class="date">JAN – MAR 2026</text>
      <circle class="ring" cx="120" cy="92" r="10" fill="none" stroke="#ec4899" stroke-width="2"/>
      <circle cx="120" cy="92" r="9" fill="#0d1117" stroke="#ec4899" stroke-width="3"/>
      <line x1="120" y1="102" x2="120" y2="124" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 4"/>
      <g class="bob">
        <rect x="0" y="124" width="240" height="245" rx="16" fill="url(#card)" stroke="#a855f7" stroke-opacity=".6" stroke-width="1.5"/>
        <rect class="shine" x="0" y="124" width="240" height="4" rx="2" fill="url(#neon)"/>
        <circle cx="38" cy="166" r="22" fill="#a21caf"/>
        <text x="38" y="171" text-anchor="middle" class="glyph">&lt;/&gt;</text>
        <text x="20" y="216" class="role">Full Stack Developer Intern</text>
        <text x="20" y="236" class="org">EduSkills · AICTE Virtual</text>
        <line x1="20" y1="250" x2="220" y2="250" stroke="#a855f7" stroke-opacity=".35"/>
        <rect x="20" y="262" width="200" height="26" rx="13" fill="#3b0764"/><text x="34" y="279" class="tag">⚙ HTML · CSS · JavaScript</text>
        <rect x="20" y="296" width="200" height="26" rx="13" fill="#3b0764"/><text x="34" y="313" class="tag">🔌 REST API Integration</text>
        <rect x="20" y="330" width="200" height="26" rx="13" fill="#be185d"/><text x="34" y="347" class="tag" style="fill:#fff;font-weight:700">🏆 Grade O (Outstanding)</text>
      </g>
    </g>
  </g>

  <!-- ===== CARD 2 ===== -->
  <g transform="translate(280,0)">
    <g class="rise d2">
      <rect x="62" y="44" width="116" height="22" rx="11" fill="#a21caf"/>
      <text x="120" y="59" text-anchor="middle" class="date">MAR – APR 2026</text>
      <circle class="ring r2" cx="120" cy="92" r="10" fill="none" stroke="#e879f9" stroke-width="2"/>
      <circle cx="120" cy="92" r="9" fill="#0d1117" stroke="#e879f9" stroke-width="3"/>
      <line x1="120" y1="102" x2="120" y2="124" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 4"/>
      <g class="bob2">
        <rect x="0" y="124" width="240" height="245" rx="16" fill="url(#card)" stroke="#e879f9" stroke-opacity=".6" stroke-width="1.5"/>
        <rect class="shine" x="0" y="124" width="240" height="4" rx="2" fill="url(#neon)"/>
        <circle cx="38" cy="166" r="22" fill="#9333ea"/>
        <text x="38" y="171" text-anchor="middle" class="glyph">CNN</text>
        <text x="20" y="216" class="role">Research Intern (AI/ML)</text>
        <text x="20" y="236" class="org">Wildlife Institute of India</text>
        <line x1="20" y1="250" x2="220" y2="250" stroke="#a855f7" stroke-opacity=".35"/>
        <rect x="20" y="262" width="200" height="26" rx="13" fill="#3b0764"/><text x="34" y="279" class="tag">🐘 Elephant ID from photos</text>
        <rect x="20" y="296" width="200" height="26" rx="13" fill="#3b0764"/><text x="34" y="313" class="tag">🧠 CNN built in Python</text>
        <rect x="20" y="330" width="200" height="26" rx="13" fill="#3b0764"/><text x="34" y="347" class="tag">🖼 OpenCV · NumPy</text>
      </g>
    </g>
  </g>

  <!-- ===== CARD 3 ===== -->
  <g transform="translate(540,0)">
    <g class="rise d3">
      <rect x="52" y="44" width="136" height="22" rx="11" fill="#be185d"/>
      <text x="120" y="59" text-anchor="middle" class="date">JUN 1 – AUG 10, 2026</text>
      <circle class="ring r3" cx="120" cy="92" r="10" fill="none" stroke="#f472b6" stroke-width="2"/>
      <circle cx="120" cy="92" r="9" fill="#0d1117" stroke="#f472b6" stroke-width="3"/>
      <line x1="120" y1="102" x2="120" y2="124" stroke="#a855f7" stroke-width="2" stroke-dasharray="3 4"/>
      <g class="bob3">
        <rect x="0" y="124" width="240" height="245" rx="16" fill="url(#card)" stroke="#f472b6" stroke-opacity=".6" stroke-width="1.5"/>
        <rect class="shine" x="0" y="124" width="240" height="4" rx="2" fill="url(#neon)"/>
        <circle cx="38" cy="166" r="22" fill="#be185d"/>
        <text x="38" y="171" text-anchor="middle" class="glyph">Py</text>
        <text x="20" y="216" class="role">Software Dev Intern (Python)</text>
        <text x="20" y="236" class="org">DigiSamaksh Pvt. Ltd.</text>
        <line x1="20" y1="250" x2="220" y2="250" stroke="#a855f7" stroke-opacity=".35"/>
        <rect x="20" y="262" width="200" height="26" rx="13" fill="#3b0764"/><text x="34" y="279" class="tag">🎯 Job-portal recommender</text>
        <rect x="20" y="296" width="200" height="26" rx="13" fill="#3b0764"/><text x="34" y="313" class="tag">📊 NumPy · Pandas · Similarity</text>
        <rect x="20" y="330" width="200" height="26" rx="13" fill="#3b0764"/><text x="34" y="347" class="tag">🔁 Agile · Git · Code Review</text>
      </g>
    </g>
  </g>
</svg>
