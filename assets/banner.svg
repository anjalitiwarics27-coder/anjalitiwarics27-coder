<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260" role="img" aria-label="Anjali Tiwari - Full-Stack Developer and AI/ML Enthusiast" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0b2e"/><stop offset="0.55" stop-color="#5b21b6"/><stop offset="1" stop-color="#2575fc"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f0abfc"/></linearGradient>
    <clipPath id="clip"><rect width="1000" height="260" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1000" height="260" fill="url(#bg)"/>
    <circle cx="120" cy="60" r="90" fill="#ec4899" opacity="0.12"><animate attributeName="r" values="80;100;80" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="880" cy="200" r="120" fill="#38bdf8" opacity="0.12"><animate attributeName="r" values="110;135;110" dur="7s" repeatCount="indefinite"/></circle>
    <g font-family="Consolas, 'Courier New', monospace" font-size="26" fill="#ddd6fe" opacity="0.55">
      <text x="70" y="70">&lt;/&gt;<animateTransform attributeName="transform" type="translate" values="0 0;0 -12;0 0" dur="4s" repeatCount="indefinite"/></text>
      <text x="880" y="80">{ }<animateTransform attributeName="transform" type="translate" values="0 0;0 10;0 0" dur="5s" repeatCount="indefinite"/></text>
      <text x="800" y="170">AI<animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="4.5s" repeatCount="indefinite"/></text>
      <text x="150" y="180">Py<animateTransform attributeName="transform" type="translate" values="0 0;0 12;0 0" dur="5.5s" repeatCount="indefinite"/></text>
    </g>
    <text x="500" y="118" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="58" font-weight="800" fill="url(#ttl)" letter-spacing="2">Anjali Tiwari
      <animate attributeName="opacity" values="0;1" dur="1.2s" fill="freeze"/>
    </text>
    <text x="500" y="162" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" fill="#e9d5ff" letter-spacing="1">Full-Stack Developer  |  AI/ML Enthusiast
      <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
    </text>
    <text x="500" y="196" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-size="16" fill="#c4b5fd">Code. Eat. Sleep. Repeat.</text>
    <g>
      <path d="M0 225 Q 125 200 250 225 T 500 225 T 750 225 T 1000 225 T 1250 225 T 1500 225 T 1750 225 T 2000 225 V260 H0Z" fill="#ffffff" opacity="0.12"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="12s" repeatCount="indefinite"/>
    </g>
    <g>
      <path d="M0 238 Q 125 218 250 238 T 500 238 T 750 238 T 1000 238 T 1250 238 T 1500 238 T 1750 238 T 2000 238 V260 H0Z" fill="#ffffff" opacity="0.2"/>
      <animateTransform attributeName="transform" type="translate" from="-1000 0" to="0 0" dur="9s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
